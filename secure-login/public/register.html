<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — Secure Login System</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="icon">✨</div>
      <h1>Create account</h1>
      <p>Register to get started</p>
    </div>

    <div class="alert alert-error" id="errorAlert"></div>
    <div class="alert alert-success" id="successAlert"></div>

    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="3–20 alphanumeric characters"/>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Min 8 chars, uppercase, number, symbol"/>
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter your password"/>
    </div>

    <button class="btn btn-primary mt-2" onclick="register()">Create Account</button>

    <div class="divider mt-2">or</div>
    <p class="text-center mt-1">
      Already have an account? <a href="login.html" class="link">Sign In</a>
    </p>
  </div>

  <script>
    async function register() {
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      clearAlerts();

      if(!username || !email || !password || !confirmPassword) {
        showError('Please fill in all fields.'); return;
      }

      if(password !== confirmPassword) {
        showError('Passwords do not match.'); return;
      }

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      const data = await res.json();

      if(!data.success) { showError(data.errors?.join(', ') || 'Registration failed.'); return; }

      showSuccess('Account created successfully! Redirecting to login...');
      setTimeout(() => window.location.href = '/login.html', 2000);
    }

    function showError(msg) {
      const el = document.getElementById('errorAlert');
      el.textContent = msg; el.style.display = 'block';
    }

    function showSuccess(msg) {
      const el = document.getElementById('successAlert');
      el.textContent = msg; el.style.display = 'block';
    }

    function clearAlerts() {
      document.getElementById('errorAlert').style.display = 'none';
      document.getElementById('successAlert').style.display = 'none';
    }

    document.addEventListener('keydown', e => { if(e.key === 'Enter') register(); });
  </script>
</body>
</html>
